<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Koppula Mani Priya</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-secondary: #0f172a;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-gradient: linear-gradient(135deg, #2563eb, #0ea5e9);
      --bg-tertiary: #1e293b;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 3rem;
    }
    
    /* Sticky action bar */
    .controls {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }
    
    .logo-text {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: var(--text-primary);
    }
    
    .logo-text span {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .btn-group {
      display: flex;
      gap: 1rem;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    
    .btn-secondary {
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }
    
    /* Resume Viewer */
    .resume-wrapper {
      margin-top: 2rem;
      width: 100%;
      max-width: 960px;
      padding: 0 1.5rem;
      display: flex;
      justify-content: center;
    }
    
    .resume-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    
    .resume-img {
      width: 100%;
      height: auto;
      display: block;
      /* Enhances contrast and removes browser blur on screen fit */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    
    /* Responsive adjustment */
    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      .logo-text {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <a href="index.html" class="logo-text"><i class="fa-solid fa-terminal" style="font-size: 1.3rem; color: var(--accent-cyan);"></i></a>
    
    <div class="btn-group">
      <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
      <a href="assets/Mani_Priya_Koppula_Resume.pdf" download class="btn btn-primary"><i class="fa-solid fa-download"></i> Download PDF</a>
    </div>
  </div>

  <div class="resume-wrapper" style="max-width: 1100px;">
    <div class="resume-card">
      <img src="assets/resume_page.jpg" alt="Resume of Koppula Mani Priya" class="resume-img">
    </div>
  </div>

</body>
</html>
